<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 320 64" width="320" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;white-space:pre}
.win{animation:win .6s cubic-bezier(.22,.61,.36,1) both}
@keyframes win{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.p{animation:pin .35s ease-out both}
@keyframes pin{from{opacity:0}to{opacity:1}}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.soft{animation:sf 2.4s ease-in-out infinite}
@keyframes sf{0%,100%{opacity:1}50%{opacity:.35}}
</style></defs><g class="win" style="animation-delay:0.15s"><rect x=".5" y=".5" width="319" height="63" rx="8" fill="#0d1117" stroke="#30363d"/><rect x=".5" y=".5" width="6" height="63" rx="3" fill="#58a6ff"/><text x="22" y="28" font-size="15" fill="#e6edf3" font-weight="700"><tspan fill="#3fb950">$</tspan> open email</text><text x="22" y="48" font-size="12" fill="#8b949e">acalusereno@hotmail.com</text><text x="302" y="38" font-size="20" fill="#58a6ff" text-anchor="end">↗</text></g></svg>